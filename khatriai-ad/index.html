<title>KhatriAI Sparrow Film</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&display=swap">
<style>
/* One world in every theme: a black screening room around an ivory,
   hand-coloured plate seen through a dithered aperture. */
:root{
  color-scheme: dark;
  --ivory:#EDE8DE; --ink:#1B1915; --ink-2:#5C564C; --clay:#CF6E4B; --clay-soft:#E3906F;
  --surround:#0B0B0A; --chrome:#E9E4D8; --chrome-dim:#8F887B; --chrome-line:#2B2824;
  --serif:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --fw:min(100%, 540px, calc((100vh - 150px) * 9 / 16));
}
@supports (height:100dvh){ :root{ --fw:min(100%, 540px, calc((100dvh - 150px) * 9 / 16)); } }
html,body{height:100%}
body{margin:0;background:var(--surround);color:var(--chrome);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.shell{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-inline:16px;padding-block:18px}
.frame{position:relative;width:var(--fw);max-width:100%;aspect-ratio:9/16;overflow:hidden;border-radius:10px;background:#000;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.playover{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);z-index:5;display:inline-flex;align-items:center;gap:.6em;white-space:nowrap;
  padding:.85em 1.4em .85em 1.15em;border:0;border-radius:999px;background:var(--ivory);color:var(--ink);
  font:600 clamp(12px,1.6vw,15px)/1 var(--sans);cursor:pointer;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.playover svg{width:1.05em;height:1.05em;fill:var(--clay)}
.playover:hover{background:#fff}
.playover:focus-visible,.ctl:focus-visible,#scrub:focus-visible{outline:2px solid var(--clay-soft);outline-offset:3px}
.controls{width:max(var(--fw), min(100%, 360px));max-width:100%;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctl{appearance:none;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--chrome-line);background:#171614;color:var(--chrome);font:500 13.5px/1 var(--sans);cursor:pointer}
.ctl:hover{border-color:#4A443C}
.ctl svg{width:13px;height:13px;fill:currentColor}
.ctl.primary{background:var(--ivory);border-color:var(--ivory);color:var(--ink)}
.ctl.primary:hover{background:#fff}
#scrub{flex:1 1 140px;min-width:0;accent-color:var(--clay);height:22px;margin:0}
.time{font-size:12.5px;color:var(--chrome-dim);font-variant-numeric:tabular-nums}
.credit{width:max(var(--fw), min(100%, 360px));max-width:100%;font-size:12px;line-height:1.5;color:var(--chrome-dim)}
.credit b{color:var(--chrome);font-weight:500}

.stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;background:var(--ivory)}
.stage>*{position:absolute;left:0;top:0}
#paper,#mont{width:1080px;height:1920px}
#illu{width:1080px;height:1920px;overflow:visible}
#rings{width:1080px;height:1920px;image-rendering:pixelated;image-rendering:crisp-edges}
.grain{inset:0;width:1080px;height:1920px;pointer-events:none;opacity:.07;mix-blend-mode:multiply;background-size:200px 200px}

#endcard{width:1080px;height:1920px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;visibility:hidden;color:var(--ink)}
.ec-mark{width:150px;overflow:visible;margin-bottom:56px}
.ec-mark .arch{fill:none;stroke:var(--clay);stroke-width:13;stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:1;opacity:0}
.ec-mark .dot{fill:var(--ink)}
.ec-maker{font:600 46px/1 var(--sans);letter-spacing:.01em;color:var(--ink-2)}
.ec-mask{overflow:hidden;padding:.02em .06em .08em;margin-top:10px}
.ec-name{display:flex;font:500 200px/1 var(--sans);letter-spacing:-.045em}
.ec-name span{display:inline-block}
.ec-tag{margin-top:40px;max-width:780px;font:italic 340 50px/1.22 var(--serif);color:var(--ink-2);text-wrap:balance}
.ec-avail{margin-top:64px;display:flex;align-items:center;gap:16px;padding:20px 38px;border-radius:999px;border:2px solid rgba(27,25,21,.2);font:500 34px/1 var(--sans)}
.ec-avail i{width:14px;height:14px;border-radius:50%;background:var(--clay)}
.ec-foot{position:absolute;left:0;right:0;bottom:70px;font:400 24px/1.4 var(--sans);color:var(--ink-2);opacity:0}

html.render,html.render body{background:#000}
html.render .shell{display:block;padding:0}
html.render .frame{width:1080px;height:1920px;max-width:none;aspect-ratio:auto;border-radius:0;box-shadow:none}
html.render .controls,html.render .credit,html.render .playover{display:none}
</style>

<div class="shell">
  <div class="frame" id="frame">
    <div class="stage" id="stage" role="img" aria-label="KhatriAI launch film: a sparrow through a dithered aperture">
      <canvas id="paper" width="1080" height="1920"></canvas>
      <svg id="illu" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
      <canvas id="mont" width="1080" height="1920"></canvas>
      <canvas id="rings" width="270" height="480"></canvas>
      <div id="endcard">
        <svg class="ec-mark" viewBox="0 0 120 100" aria-hidden="true">
          <path class="arch" d="M14 90V52a26 26 0 0 1 52 0v38" pathLength="1"/>
          <path class="arch" d="M54 90V52a26 26 0 0 1 52 0v38" pathLength="1"/>
          <circle class="dot" cx="60" cy="8" r="7" transform="scale(0)"/>
        </svg>
        <div class="ec-maker" id="ec-maker">ManitPF</div>
        <div class="ec-mask"><div class="ec-name" id="ec-name">KhatriAI</div></div>
        <div class="ec-tag" id="ec-tag">Built for your most ambitious, long&#8209;running work.</div>
        <div class="ec-avail" id="ec-avail"><i></i>Available today</div>
        <div class="ec-foot" id="ec-foot">A concept film. Every frame and note is generated in code.</div>
      </div>
      <div class="grain" id="grain"></div>
    </div>
    <button class="playover" id="playover" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9.5-5.5z"/></svg>Play film · sound on</button>
  </div>
  <div class="controls">
    <button class="ctl primary" id="play" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path id="play-ico" d="M4 2.5v11l9.5-5.5z"/></svg><span id="play-lbl">Play</span></button>
    <button class="ctl" id="restart" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5a5.5 5.5 0 1 1-5.2 3.7l1.4.5A4 4 0 1 0 8 4v2L4.8 3.2 8 .5z"/></svg>Restart</button>
    <input type="range" id="scrub" min="0" max="26.4" step="0.01" value="0" aria-label="Film position">
    <span class="time" id="time">0:00 / 0:26</span>
    <button class="ctl" id="sound" type="button" aria-pressed="true">Sound on</button>
  </div>
  <div class="credit"><b>ManitPF · KhatriAI</b>. The bird, the plates, the rings and the music are all drawn and synthesized by code on this page.</div>
</div>

<script>
(() => {
'use strict';
const W = 1080, H = 1920, CX = 540, CY = 1043, RAP = 738;
const DUR = 26.4, BAR = 2.4, BEAT = 0.6, POSTER = 8.6;
const CUTS = [9.6, 10.8, 12.0, 13.2, 14.4, 15.6];
const $ = s => document.querySelector(s);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const lerp = (a, b, p) => a + (b - a) * p;
const sstep = (a, b, x) => { const u = clamp((x - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); };
const E = {
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inCubic: x => x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  inOutSine: x => -(Math.cos(Math.PI * x) - 1) / 2,
  outBack: x => { const c1 = 1.7, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
};
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeNoise(seed) {
  const r = rng(seed), perm = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
  const P = new Uint8Array(512); for (let i = 0; i < 512; i++) P[i] = perm[i & 255];
  const V = new Float32Array(256).map(() => r() * 2 - 1);
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const X = xi & 255, Y = yi & 255;
    const a = V[P[X + P[Y]]], b = V[P[X + 1 + P[Y]]], c = V[P[X + P[Y + 1]]], d = V[P[X + 1 + P[Y + 1]]];
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
}
const fbm = (n, x, y, o = 4) => { let s = 0, a = .5, f = 1; for (let i = 0; i < o; i++) { s += a * n(x * f, y * f); a *= .5; f *= 2.03; } return s; };

/* ================= paper ================= */
function paperInto(ctx, w, h, base, seed, vignette) {
  const img = ctx.createImageData(w, h), d = img.data, r = rng(seed), n = makeNoise(seed + 1);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const k = (y * w + x) * 4;
    let v = (r() - .5) * 7 + fbm(n, x / 90, y / 90, 3) * 10 + n(x / 3.5, y / 40) * 2.5;
    if (vignette) { const dd = Math.hypot(x - vignette[0], y - vignette[1]); v -= sstep(vignette[2] * .55, vignette[2], dd) * 16; }
    d[k] = base[0] + v; d[k + 1] = base[1] + v; d[k + 2] = base[2] + v * .9; d[k + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}
paperInto($('#paper').getContext('2d'), W, H, [237, 232, 222], 21, [CX, CY, RAP]);
(() => {
  const c = document.createElement('canvas'); c.width = c.height = 200;
  const g = c.getContext('2d'), img = g.createImageData(200, 200), r = rng(9);
  for (let i = 0; i < img.data.length; i += 4) { const v = 110 + r() * 145; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0); $('#grain').style.backgroundImage = `url(${c.toDataURL()})`;
})();

/* ================= the plate: sparrow and lily, built as SVG ================= */
const NS = 'http://www.w3.org/2000/svg';
const svg = $('#illu');
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
const f1 = x => Math.round(x * 10) / 10;
function smooth(pts, close) {
  const n = pts.length, P = i => close ? pts[(i + n) % n] : pts[clamp(i, 0, n - 1)];
  let d = `M${f1(pts[0][0])},${f1(pts[0][1])}`;
  for (let i = 0; i < (close ? n : n - 1); i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    d += `C${f1(p1[0] + (p2[0] - p0[0]) / 6)},${f1(p1[1] + (p2[1] - p0[1]) / 6)} ${f1(p2[0] - (p3[0] - p1[0]) / 6)},${f1(p2[1] - (p3[1] - p1[1]) / 6)} ${f1(p2[0])},${f1(p2[1])}`;
  }
  return d + (close ? 'Z' : '');
}
const defs = el('defs', {}, svg);
let gid = 0;
function grad(stops, x1, y1, x2, y2) {
  const id = 'lg' + (gid++), g = el('linearGradient', { id, gradientUnits: 'userSpaceOnUse', x1: f1(x1), y1: f1(y1), x2: f1(x2), y2: f1(y2) }, defs);
  stops.forEach(([o, c, a]) => el('stop', { offset: o, 'stop-color': c, 'stop-opacity': a == null ? 1 : a }, g));
  return `url(#${id})`;
}
function rgrad(stops, cx, cy, r) {
  const id = 'rg' + (gid++), g = el('radialGradient', { id, gradientUnits: 'userSpaceOnUse', cx, cy, r }, defs);
  stops.forEach(([o, c, a]) => el('stop', { offset: o, 'stop-color': c, 'stop-opacity': a == null ? 1 : a }, g));
  return `url(#${id})`;
}

/* a feather: rounded vane, dark chevron barring, pale shaft */
function feather(parent, o) {
  const { L, Wd, base = 12, x = 0, y = 0, rot = 0, curve = 0, c0, c1, edge = '#3a1f10', bar = '#2a150a', barGap = 12, barOp = .5, barW = 2.4, shaft = '#e0c29f', bars = true, fringe = null } = o;
  const g = el('g', { transform: `translate(${f1(x)},${f1(y)}) rotate(${f1(rot)})` }, parent);
  const hwAt = u => u < .86 ? lerp(base / 2, Wd / 2, sstep(0, .55, u)) : Wd / 2 * Math.sqrt(Math.max(0, 1 - ((u - .86) / .14) ** 2));
  const N = 24, top = [], bot = [], mid = [];
  for (let i = 0; i <= N; i++) { const u = i / N, s = u * L, cy = curve * u * u * L, hw = hwAt(u); top.push([s, cy - hw]); bot.push([s, cy + hw]); mid.push([s, cy]); }
  el('path', { d: smooth([...top, ...bot.slice().reverse()], true), fill: grad([[0, c0], [1, c1]], 0, 0, L, 0), stroke: edge, 'stroke-width': 1.3, 'stroke-linejoin': 'round' }, g);
  if (fringe) el('path', { d: smooth(top.slice(2, N - 1).map(([s, yy]) => [s, yy + 3.2]), false), fill: 'none', stroke: fringe, 'stroke-width': 2.2, 'stroke-opacity': .55 }, g);
  if (bars) {
    let d = '';
    for (let s = barGap * 1.7; s < L * .94; s += barGap) {
      const u = s / L, cy = curve * u * u * L, hw = hwAt(u) * .9;
      d += `M${f1(s - 3)},${f1(cy - hw)}L${f1(s + 3.5)},${f1(cy)}L${f1(s - 3)},${f1(cy + hw)}`;
    }
    el('path', { d, fill: 'none', stroke: bar, 'stroke-width': barW, 'stroke-opacity': barOp, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
  }
  el('path', { d: smooth(mid.slice(0, N - 1), false), fill: 'none', stroke: shaft, 'stroke-width': 1.5, 'stroke-opacity': .5 }, g);
  return g;
}

/* ---- the lily: a rosette of folded leaves and a pale flower spike ---- */
const plant = el('g', { id: 'plant' }, svg);
const stemG = el('g', {}, plant);
const leavesBack = el('g', {}, plant);
const LEAF_BASE = [656, 1745];
const LEAVES = [
  // angle(deg, screen), length, width, bend, droop, layer(0 back,1 front), light
  [-98, 600, 120, .05, .12, 0, .88], [-128, 700, 130, -.16, .32, 0, .9], [-70, 690, 128, .16, .30, 0, .9],
  [-52, 760, 118, .10, .12, 0, 1], [-158, 640, 136, -.10, .30, 1, 1], [-22, 620, 136, .10, .34, 1, 1],
  [-118, 520, 130, -.18, .30, 1, 1.04], [-80, 500, 130, .18, .30, 1, 1.04], [-100, 360, 118, .02, .14, 1, 1.07]
];
function buildLeaf(parent, [ang, len, wid, bend, droop, , light]) {
  const g = el('g', {}, parent);
  const a = ang * Math.PI / 180, dir = [Math.cos(a), Math.sin(a)], nrm = [-dir[1], dir[0]];
  const [bx, by] = LEAF_BASE;
  const P0 = [bx, by], P2 = [bx + dir[0] * len, by + dir[1] * len + droop * len];
  const P1 = [bx + dir[0] * len * .55 + nrm[0] * bend * 1.8 * len, by + dir[1] * len * .55 + nrm[1] * bend * 1.8 * len - len * .12];
  const N = 22, C = [], T = [], L = [], R = [];
  for (let i = 0; i <= N; i++) {
    const u = i / N, q = 1 - u;
    const p = [q * q * P0[0] + 2 * q * u * P1[0] + u * u * P2[0], q * q * P0[1] + 2 * q * u * P1[1] + u * u * P2[1]];
    const d = [2 * q * (P1[0] - P0[0]) + 2 * u * (P2[0] - P1[0]), 2 * q * (P1[1] - P0[1]) + 2 * u * (P2[1] - P1[1])];
    const dl = Math.hypot(d[0], d[1]) || 1, n = [-d[1] / dl, d[0] / dl];
    const w = wid * .5 * Math.pow(Math.min(1, u / .12), .6) * Math.pow(Math.max(0, 1 - Math.pow(u, 2.2)), .7);
    C.push(p); T.push(n); L.push([p[0] + n[0] * w, p[1] + n[1] * w]); R.push([p[0] - n[0] * w, p[1] - n[1] * w]);
  }
  const k = light, mix = (c, f) => '#' + c.match(/\w\w/g).map(h => clamp(Math.round(parseInt(h, 16) * f), 0, 255).toString(16).padStart(2, '0')).join('');
  el('path', { d: smooth([...L, ...C.slice().reverse()], true), fill: grad([[0, mix('#e8eabb', k)], [.35, mix('#bcd384', k)], [1, mix('#94ba5e', k)]], P0[0], P0[1], P2[0], P2[1]) }, g);
  el('path', { d: smooth([...C, ...R.slice().reverse()], true), fill: grad([[0, mix('#cfd9a2', k)], [.35, mix('#8fb15f', k)], [1, mix('#62903f', k)]], P0[0], P0[1], P2[0], P2[1]) }, g);
  let veins = '';
  [.3, .55, .8, -.3, -.55, -.8].forEach(f => {
    const pts = C.map((p, i) => { const w = Math.hypot(L[i][0] - p[0], L[i][1] - p[1]) * f; return [p[0] + T[i][0] * w, p[1] + T[i][1] * w]; });
    veins += smooth(pts.slice(1, N), false);
  });
  el('path', { d: veins, fill: 'none', stroke: '#f3f1d6', 'stroke-width': 1.3, 'stroke-opacity': .32 }, g);
  el('path', { d: smooth(C.slice(0, N), false), fill: 'none', stroke: '#eef0cc', 'stroke-width': 2.6, 'stroke-opacity': .55 }, g);
  el('path', { d: smooth([...L, ...R.slice().reverse()], true), fill: 'none', stroke: '#3f6a2c', 'stroke-width': 1.4, 'stroke-opacity': .75 }, g);
  return g;
}
const leafGs = LEAVES.map(lf => ({ g: buildLeaf(lf[5] ? null : leavesBack, lf), lf }));

// flower spike
const STEM = [[655, 1650], [640, 1290], [612, 900], [600, 520]];
const stemPath = `M${STEM[0]}C${STEM[1]} ${STEM[2]} ${STEM[3]}`;
el('path', { d: stemPath, fill: 'none', stroke: '#5f7f4a', 'stroke-width': 7.5, 'stroke-linecap': 'round' }, stemG);
const stemLine = el('path', { d: stemPath, fill: 'none', stroke: '#a9c08d', 'stroke-width': 4, 'stroke-linecap': 'round', pathLength: 1 }, stemG);
const stemDark = stemG.firstChild; stemDark.setAttribute('pathLength', 1);
const bez = (u, P) => { const q = 1 - u; return [0, 1].map(i => q * q * q * P[0][i] + 3 * q * q * u * P[1][i] + 3 * q * u * u * P[2][i] + u * u * u * P[3][i]); };
const florets = [];
(() => {
  const r = rng(4);
  for (let i = 0; i < 16; i++) {
    const u = 1 - i * .016 - (i > 11 ? .01 : 0), p = bez(u, STEM), side = i % 2 ? 1 : -1;
    const len = 22 + (16 - i) * 1.8 * (i > 12 ? .4 : 1), ang = side * (30 + r() * 25) - 90;
    const tip = [p[0] + Math.cos(ang * Math.PI / 180) * len, p[1] + Math.sin(ang * Math.PI / 180) * len];
    const g = el('g', {}, stemG);
    el('path', { d: `M${f1(p[0])},${f1(p[1])}Q${f1((p[0] + tip[0]) / 2 + side * 4)},${f1((p[1] + tip[1]) / 2 + 6)} ${f1(tip[0])},${f1(tip[1])}`, fill: 'none', stroke: '#8fa87a', 'stroke-width': 2 }, g);
    const fg = el('g', { transform: `translate(${f1(tip[0])},${f1(tip[1])})` }, g);
    const bloom = el('g', {}, fg);
    const open = i < 11 && i % 3 !== 2, size = (i < 11 ? 24 : 14) * (1 - i * .014);
    const cup = el('g', { transform: `rotate(${f1(ang + 90)})` }, bloom);
    if (open) {

/* 5 · a scanning-electron micrograph of the mark */
function plateScan() {
  const [c, g] = plate(), img = g.createImageData(PS, PS), d = img.data, r = rng(71), n = makeNoise(72), n2 = makeNoise(73);

    const k = (y * PS + x) * 4;
    const [du] = markDist(UX(x), UY(y)), dp = du * MSc;
    const tex = fbm(n, x / 18, y / 18, 3), grain = (r() - .5) * 34;
    let v = 26 + fbm(n2, x / 140, y / 140, 3) * 30 + tex * 18;
    const hwj = hw + fbm(n, x / 40, y / 40, 2) * 8;
    if (dp < hwj) {

    const rg = g.createRadialGradient(x - R * .3, y - R * .3, 0, x, y, R); rg.addColorStop(0, 'rgba(235,235,235,.9)'); rg.addColorStop(1, 'rgba(90,90,90,.2)');

  g.font = mono(17); g.fillStyle = '#bdbdbd'; g.fillText('KHATRIAI LAB · SEM-5.1', 282, 1152);

}

/* ================= the dithered aperture ================= */
const RW = 270, RH = 480, RS = 4;
const rc = $('#rings').getContext('2d'), rimg = rc.createImageData(RW, RH);

  R += E.inOutCubic(prog(t, 17.3, 18.5)) * 620;

}
